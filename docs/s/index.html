<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Scheda di emergenza del tesserino del capo.">
<meta name="theme-color" content="#0B0614">
<meta property="og:title" content="Mi sono perso">
<meta property="og:description" content="Scheda di emergenza del tesserino del capo.">
<meta property="og:image" content="https://lavoroperuncane.it/img/og.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="../img/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../img/icon-192.png">
<meta name="robots" content="noindex">
<title>Mi sono perso</title>
<style>
:root{--hot:#FF3DAE;--bg:#0B0614;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:#F5EFFF;font:400 1.05rem/1.5 "Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;display:flex;align-items:flex-start;justify-content:center;padding:1.25rem 1rem 3rem}
.sos{background:#fff;color:#14101C;border-radius:20px;padding:1.3rem;display:flex;flex-direction:column;gap:1rem;width:100%;max-width:26rem;box-shadow:0 0 0 4px var(--hot),0 0 40px rgba(255,61,174,.35)}
.tag{align-self:flex-start;font:800 .85rem/1 system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;background:#E0123F;color:#fff;padding:.5rem .7rem;border-radius:6px}
h1{margin:0;font:800 2.1rem/1.05 "Arial Black",system-ui,sans-serif}
.call{display:flex;flex-direction:column;gap:.25rem;background:#E0123F;color:#fff;border-radius:14px;padding:1rem 1.1rem;text-decoration:none}
.call small{font:600 .75rem/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.call strong{font:800 1.8rem/1.1 "Arial Black",system-ui,sans-serif;word-break:break-word}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.5rem 1rem}
dt{font:600 .74rem/1.6 ui-monospace,Menlo,monospace;text-transform:uppercase;color:#6A5F7C}
dd{margin:0;font-weight:700;word-break:break-word}
dd a{color:inherit}
.foot{font-size:.85rem;color:#6A5F7C;margin:0}
.foot a{color:#9B1D6A}
</style>
</head>
<body>
<main class="sos" id="card">
  <span class="tag">Mi sono perso</span>
  <h1>Questa pagina si apre dal QR del tesserino.</h1>
  <p class="foot">Se hai trovato un animale col tesserino, inquadra il codice QR sul retro con la fotocamera. Il tesserino si fa gratis su <a href="/ufficio/">L'ufficio del capo</a>.</p>
</main>
<script>
(function(){
  var h=location.hash.slice(1); if(!h)return;
  var a=h.split('~').map(function(x){try{return decodeURIComponent(x)}catch(e){return x}});
  var d={pet:a[1],owner:a[2],phone:a[3],chip:a[4],vet:a[5],vetphone:a[6],allergy:a[7],meds:a[8],extra:a[9]};
  function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function tel(n){return 'tel:'+String(n||'').replace(/[^\d+]/g,'')}
  var rows='';function add(k,v){if(v)rows+='<dt>'+k+'</dt><dd>'+v+'</dd>'}
  add('Microchip',esc(d.chip));
  if(d.vet||d.vetphone)add('Veterinario',esc(d.vet)+(d.vetphone?' · <a href="'+tel(d.vetphone)+'">'+esc(d.vetphone)+'</a>':''));
  add('Allergie',esc(d.allergy));add('Medicine',esc(d.meds));add('Nota',esc(d.extra));
  document.title='Ciao, sono '+(d.pet||'un capo');
  document.getElementById('card').innerHTML='<span class="tag">Mi sono perso</span><h1>Ciao, sono '+esc(d.pet||'un capo')+'</h1>'+
    (d.phone?'<a class="call" href="'+tel(d.phone)+'"><small>Tocca per chiamare '+(d.owner?esc(d.owner):'il mio umano')+'</small><strong>'+esc(d.phone)+'</strong></a>':'')+
    (rows?'<dl>'+rows+'</dl>':'')+
    '<p class="foot">Tienimi al sicuro finché non arriva. Grazie da parte del capo.</p><p class="foot">Non risponde nessuno? <a href="/smarrito/">Chi chiamare nella tua provincia</a>.</p><p class="foot">Tesserino fatto con <a href="/ufficio/">L\'ufficio del capo</a>. Questi dati stanno solo nel QR: il sito non li conserva.</p>';
})();
</script>
</body>
</html>
